name: Package backend release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "backend-release"
  cancel-in-progress: false

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node for frontend build
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lint (server/ 纯 JS 无类型检查，靠 no-undef 拦崩溃类错误)
        run: npm run lint

      - name: Unit tests
        run: npm test

      # 先建前端：Playwright 一跑就会把两套 webServer 都起起来（配置级不能按 project 挑），
      # 其中伺服 dist/ 的那台（e2e/serve-dist.mjs）发现产物缺失/过期会自己补一次 build——
      # 那样构建坏了会红在"浏览器冒烟"这一步里，看不出是谁的锅。放在前面，台架直接复用。
      - name: Build frontend
        run: |
          npm run build

      # 浏览器层只进这里，不进 npm run verify（闸门一慢就会被跳过）。A 组冒烟 5 条 + B 组
      # 导入与阅读 10 条：盯的是桩之外接没接上——真挂载、真 IndexedDB 落盘、真文件解码、
      # 真遮挡、跳章落点，jsdom 一样都给不了。C/D/E/F/G/H 组留给本地 `npm run e2e`。
      # 刻意不加 retries：一条时灵时不灵的用例等于没有判据，宁可让它红一次并当场查根。
      - name: Browser smoke (A 组冒烟 + B 组导入阅读)
        run: |
          npx playwright install --with-deps chromium
          npm run e2e:ab

      - name: Upload browser report (只在失败时留证据)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-smoke-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      # 探针要在临时库上真开 SQLite；上面的 npm ci --ignore-scripts 没编译原生模块
      - name: Rebuild better-sqlite3 for probes
        run: npm rebuild better-sqlite3

      - name: Server probes (备份恢复 / 地图迁移 / 重传不删库 / 同步会话 / RAG 指纹 / 代理流式 / 后端启动)
        run: |
          npm run probe:backup
          npm run probe:maps
          npm run probe:reupload
          npm run probe:sync
          npm run probe:rag
          npm run probe:proxy
          npm run probe:boot

      - name: Package backend (light)
        shell: pwsh
        run: ./pack-backend.ps1

      - name: Package full (frontend + backend)
        shell: pwsh
        run: ./pack-backend.ps1 -IncludeDist

      - name: Verify package contents
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          function Check-Zip {
            param($Path, [string[]]$Required, $ExpectedVersion)
            if (-not (Test-Path $Path)) { Write-Error "Package missing: $Path" }
            $archive = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $Path))
            try {
              $names = $archive.Entries | ForEach-Object { $_.FullName.Replace('\', '/') }
              $missing = @($Required | Where-Object { $_ -notin $names })
              if ($missing.Count -gt 0) {
                Write-Error "$Path missing critical files: $($missing -join ', ')"
              }
              if ($ExpectedVersion) {
                $entry = $archive.Entries | Where-Object { $_.FullName.Replace('\', '/') -eq "package.json" } | Select-Object -First 1
                $reader = New-Object System.IO.StreamReader($entry.Open())
                try { $zipPkg = $reader.ReadToEnd() | ConvertFrom-Json } finally { $reader.Dispose() }
                if ($zipPkg.version -ne $ExpectedVersion) {
                  Write-Error "$Path version mismatch: zip=$($zipPkg.version), tag=$ExpectedVersion"
                }
              }
              Write-Host "$Path OK: entries $($names.Count)"
            } finally {
              $archive.Dispose()
            }
          }
          $tagVersion = $null
          if ($env:GITHUB_REF_TYPE -eq "tag") { $tagVersion = $env:GITHUB_REF_NAME -replace '^v', '' }
          Check-Zip "release/ai-novel-reader-v2-backend.zip" @("server/tts-worker.py", "server/routes/rag.js", "package.json", "start.bat", "start.sh") $tagVersion
          Check-Zip "release/ai-novel-reader-v2-full.zip" @("server/tts-worker.py", "server/routes/rag.js", "package.json", "start.bat", "start.sh", "dist/index.html", "dist/sw.js") $tagVersion

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/ai-novel-reader-v2-backend.zip
            release/ai-novel-reader-v2-full.zip
          generate_release_notes: true

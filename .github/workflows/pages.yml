name: Deploy static content to Pages

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (tsc -p, 根 tsconfig 是空操作)
        run: npm run typecheck

      - name: Lint (含 server/ 纯 JS 的 no-undef 类崩溃检查)
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Backup/restore probe (server 端 SQLite 链，需 better-sqlite3 原生模块)
        run: npm run probe:backup

      - name: maps/graphs 主键迁移探针 (旧库副本上验证)
        run: npm run probe:maps

      - name: LLM 代理流式透传探针 (SSE 不被 JSON.parse 打死)
        run: npm run probe:proxy

      - name: Server boot probe (真实拉起后端 + HTTP 校验)
        run: npm run probe:boot

      - name: Build
        run: npm run build

      - name: Verify COI injected into sw.js
        run: grep -q "Cross-Origin-Embedder-Policy" dist/sw.js

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4